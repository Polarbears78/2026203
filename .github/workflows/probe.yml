name: Probe school site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect month navigation
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          export LC_ALL=C.UTF-8

          curl -s -A "$UA" -L --max-time 30 "https://ymk.gwe.ms.kr/schedule/list.do?m=0203" -o /tmp/list.html

          echo "--- form tag ---"
          grep -oiE "<form[^>]*>" /tmp/list.html | head -5 || true
          echo "--- inputs with Year/Month ---"
          grep -oiE "<input[^>]*(year|month)[^>]*>" /tmp/list.html | head -10 || true
          echo "--- onclick/href with year or month or calendar nav ---"
          grep -oiE "(onclick|href)=\"[^\"]*([Yy]ear|[Mm]onth|calendar|prev|next)[^\"]*\"" /tmp/list.html | head -15 || true
          echo "--- any goList/fnList/search JS calls ---"
          grep -oiE "(goList|fnList|fnSearch|searchList|goPage)\([^)]*\)" /tmp/list.html | head -10 || true

          echo ""
          echo "--- TRY next month via searchYear/searchMonth ---"
          curl -s -A "$UA" -L --max-time 30 "https://ymk.gwe.ms.kr/schedule/list.do?m=0203&searchYear=2026&searchMonth=7" -o /tmp/n1.html
          echo "n1 자유복 seqs:"; grep -oE "viewData\('[0-9]+'\)[^<]*자유복" /tmp/n1.html | head || true
          echo "n1 month input:"; grep -oiE "<input[^>]*month[^>]*>" /tmp/n1.html | head -3 || true

          echo "--- TRY next month via sch_year/sch_month ---"
          curl -s -A "$UA" -L --max-time 30 "https://ymk.gwe.ms.kr/schedule/list.do?m=0203&sch_year=2026&sch_month=07" -o /tmp/n2.html
          echo "n2 자유복 seqs:"; grep -oE "viewData\('[0-9]+'\)[^<]*자유복" /tmp/n2.html | head || true
          echo "n2 month input:"; grep -oiE "<input[^>]*month[^>]*>" /tmp/n2.html | head -3 || true
