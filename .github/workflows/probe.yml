name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe with timing
        run: |
          EP="https://script.google.com/macros/s/AKfycbxh4kD1tkNfcz3NiCVJ45JXpYWEdZKCu6kHYGEJqtwNFmwdRsd3MxpuJJekqULyQ54/exec"
          for A in content roomSurvey board; do
            echo "===== $A ====="
            curl -sL --max-time 120 "$EP?action=$A" -w "\n[HTTP=%{http_code} 소요=%{time_total}s]\n" | head -c 400
            echo ""
          done
