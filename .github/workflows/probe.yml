name: Probe NEIS meal API

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query NEIS
        run: |
          echo "########## schoolInfo (육민관중학교) ##########"
          curl -s --max-time 30 "https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=10&SCHUL_NM=%EC%9C%A1%EB%AF%BC%EA%B4%80%EC%A4%91%ED%95%99%EA%B5%90" -o si.json
          echo "bytes: $(wc -c < si.json)"; head -c 2500 si.json; echo

          echo ""
          echo "########## mealServiceDietInfo (K10 / 7822141, 2026-06) ##########"
          curl -s --max-time 30 "https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=50&ATPT_OFCDC_SC_CODE=K10&SD_SCHUL_CODE=7822141&MLSV_FROM_YMD=20260601&MLSV_TO_YMD=20260630" -o meal.json
          echo "bytes: $(wc -c < meal.json)"; head -c 3000 meal.json; echo
