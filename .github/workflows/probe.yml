name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe board endpoint
        run: |
          EP="https://script.google.com/macros/s/AKfycby9POET85dvQoraZRfvx4XvAdWX-ZN3xWkVIQPCyQeDp3TwRyvURm1aqhEYfcqv48IG/exec"
          echo "===== GET action=board ====="
          curl -sL "$EP?action=board&callback=cb" | head -c 2000
          echo ""
          echo "===== GET action=studyStats ====="
          curl -sL "$EP?action=studyStats&callback=cb" | head -c 2000
          echo ""
          echo "===== live style.css date rule ====="
          curl -sL "https://polarbears78.github.io/2026203/style.css" | grep -n 'input\[type="date"\]'
