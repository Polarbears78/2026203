name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          EP="https://script.google.com/macros/s/AKfycby9POET85dvQoraZRfvx4XvAdWX-ZN3xWkVIQPCyQeDp3TwRyvURm1aqhEYfcqv48IG/exec"
          for A in content roomSurvey; do
            echo "===== $A ====="
            curl -sL "$EP?action=$A" | head -c 1200
            echo ""
          done
          echo "===== 라이브 weekly.html 폴백 안내 포함 여부 ====="
          curl -sL "https://polarbears78.github.io/2026203/weekly.html" | grep -c "wFallback" || echo "0 (구버전)"
