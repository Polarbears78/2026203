<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>방학 학습 기록 통계 — 2학년 3반</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  :root{
    --blue:#7b83eb; --green:#37c07f; --orange:#ff8a5c; --violet:#a06be0; --teal:#3bb6c9;
    --bg:#fbeef7; --card:#fff; --ink:#4a3b56; --muted:#a08bb0; --line:#f0e0ee;
    --cute:"Jua",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(180deg,#fff2f9 0%,#eef1ff 100%) fixed; min-height:100vh; color:var(--ink); line-height:1.55;
  }
  header{ background:linear-gradient(135deg,#ff9ecd 0%,#b58cf0 100%); color:#fff; padding:22px 16px; text-align:center;
    border-radius:0 0 28px 28px; box-shadow:0 6px 18px rgba(181,140,240,.28); }
  header h1{ font-family:var(--cute); font-size:1.5rem; font-weight:400; text-shadow:0 2px 6px rgba(150,80,140,.25); }
  header p{ opacity:.95; font-size:.88rem; margin-top:2px; }
  main{ max-width:720px; margin:0 auto; padding:16px 14px 48px; }
  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:16px; margin-bottom:14px;
    box-shadow:0 6px 16px rgba(190,130,170,.16), 0 2px 5px rgba(190,130,170,.10); }
  .card h2{ font-family:var(--cute); font-size:1.15rem; font-weight:400; margin-bottom:12px; }
  .summary{ display:flex; gap:10px; text-align:center; }
  .summary .it{ flex:1; padding:6px 0; }
  .summary .n{ font-family:var(--cute); font-size:1.9rem; font-weight:400; color:var(--blue); }
  .summary .l{ font-size:.78rem; color:var(--muted); font-weight:700; }
  .status{ color:var(--muted); font-size:.9rem; text-align:center; padding:14px 0; }
  .chart-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chart-scroll svg{ display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:.8rem; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }
  .chead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .chead h2{ margin:0; }
  .sort{ display:flex; gap:6px; }
  .sort button{ border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px;
    padding:6px 12px; font-size:.8rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .sort button.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .twrap{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; min-width:460px; font-size:.88rem; }
  th,td{ border:1px solid var(--line); padding:8px 6px; text-align:center; white-space:nowrap; }
  thead th{ background:var(--blue); color:#fff; }
  td.num{ font-weight:800; color:var(--blue); } td.name{ text-align:left; } td.tot{ font-weight:800; background:#f0f1ff; }
  tbody tr:nth-child(even){ background:#fdf7fb; }
  tfoot th{ background:var(--bg); }
  .btn{ display:block; width:100%; text-align:center; border:2px solid var(--blue); background:#fff; color:var(--blue);
    font-weight:800; padding:12px; border-radius:15px; cursor:pointer; font-family:inherit; font-size:.95rem; margin-top:12px;
    transition:transform .12s ease, background .12s ease; }
  .btn:active{ background:#f0f1ff; transform:scale(.97); }
  .note{ font-size:.82rem; color:var(--muted); margin-top:10px; }
  .rcount{ font-size:.8rem; color:var(--muted); font-weight:600; }
  .reading-list{ display:flex; flex-direction:column; gap:8px; }
  .r-item{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .r-meta{ font-size:.8rem; color:var(--muted); font-weight:700; margin-bottom:3px; }
  .r-meta b{ color:var(--blue); }
  .r-body{ font-size:.9rem; white-space:pre-wrap; word-break:break-word; }
  .r-empty{ color:var(--muted); font-size:.9rem; }
  .back{ display:inline-block; color:#fff; text-decoration:none; font-size:.85rem; font-weight:600; opacity:.9; }
  .foot{ text-align:center; color:var(--muted); font-size:.8rem; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div style="max-width:720px;margin:0 auto;text-align:left"><a class="back" href="index.html">‹ 홈</a></div>
  <h1>📊 방학 학습 기록 통계</h1>
  <p>2학년 3반</p>
</header>

<main>
  <section class="card">
    <div class="summary">
      <div class="it"><div class="n" id="sStudents">—</div><div class="l">참여 학생</div></div>
      <div class="it"><div class="n" id="sRecords">—</div><div class="l">총 기록 수</div></div>
      <div class="it"><div class="n" id="sDays">—</div><div class="l">기록 기간(일)</div></div>
    </div>
    <p class="note" id="periodNote" style="text-align:center"></p>
  </section>

  <p class="status" id="status">불러오는 중…</p>

  <div id="content" hidden>
    <section class="card">
      <h2>번호별 총문항 수</h2>
      <div class="chart-scroll"><svg id="chartNum" width="100%" role="img" aria-label="번호별 총문항 막대그래프"></svg></div>
      <p class="note">막대 높이 = 국어+수학+영어 푼 문항 수 합계</p>
    </section>

    <section class="card">
      <h2>일별 전체 학습량 추이</h2>
      <div class="chart-scroll"><svg id="chartDay" width="100%" role="img" aria-label="일별 학습량 추이"></svg></div>
      <p class="note">반 전체가 그 날 푼 총문항 수의 합</p>
    </section>

    <section class="card">
      <h2>과목별 합계</h2>
      <div class="chart-scroll"><svg id="chartSubj" width="100%" role="img" aria-label="과목별 합계"></svg></div>
      <div class="legend">
        <span><i style="background:var(--blue)"></i>국어</span>
        <span><i style="background:var(--green)"></i>수학</span>
        <span><i style="background:var(--orange)"></i>영어</span>
        <span><i style="background:var(--teal)"></i>과학</span>
        <span><i style="background:var(--violet)"></i>영단어</span>
      </div>
    </section>

    <section class="card">
      <div class="chead">
        <h2>번호별 합계 표</h2>
        <div class="sort">
          <button class="on" data-sort="num">번호순</button>
          <button data-sort="total">총문항순</button>
        </div>
      </div>
      <div class="twrap">
        <table>
          <thead><tr><th>번호</th><th>이름</th><th>일수</th><th>국어</th><th>수학</th><th>영어</th><th>과학</th><th>영단어</th><th>총문항</th></tr></thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>독서활동 기록 <span id="readCount" class="rcount"></span></h2>
      <div id="readingList"></div>
    </section>
  </div>

  <button class="btn" id="saveImg" style="border-color:var(--green);color:var(--green)">📷 이미지로 저장 (PNG)</button>
  <button class="btn" id="refresh">🔄 새로고침</button>
  <p class="foot">육민관중학교 2학년 3반 · 교사용</p>
</main>

<script>
  // 교사용 비밀번호 잠금 (직접 주소 접근 차단)
  if (sessionStorage.getItem('teacherAuth') !== 'ok') {
    const pw = prompt('🔒 교사용 비밀번호를 입력하세요');
    if (pw === '3275') {
      try { sessionStorage.setItem('teacherAuth', 'ok'); } catch {}
    } else {
      document.body.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:24px;text-align:center;font-family:sans-serif;color:#4a3b56"><h2>🔒 접근 권한이 없습니다</h2><p>교사용 통계 페이지입니다.</p><p><a href="index.html">홈으로 돌아가기</a></p></div>';
      throw new Error('unauthorized');
    }
  }

  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxh4kD1tkNfcz3NiCVJ45JXpYWEdZKCu6kHYGEJqtwNFmwdRsd3MxpuJJekqULyQ54/exec';
  const $ = (id) => document.getElementById(id);
  let rows = [], sortMode = 'num', timer = null;

  function load() {
    $('status').style.display = 'block';
    $('status').textContent = '불러오는 중…';
    $('content').hidden = true;
    const old = $('jsonp'); if (old) old.remove();
    timer = setTimeout(() => {
      $('status').textContent = '데이터를 불러오지 못했어요. 새로고침하거나 스크립트 재배포 상태를 확인해 주세요.';
    }, 12000);
    const s = document.createElement('script');
    s.id = 'jsonp';
    s.src = ENDPOINT + '?action=studyStats&callback=onStudyData&_=' + String(performance.now()).replace('.', '');
    s.onerror = () => { clearTimeout(timer); $('status').textContent = '엔드포인트에 연결하지 못했어요.'; };
    document.body.appendChild(s);
  }
  window.onStudyData = (data) => {
    clearTimeout(timer);
    if (!data || !data.ok) { $('status').textContent = '데이터를 읽지 못했어요' + (data && data.message ? ' (' + data.message + ')' : '') + '.'; return; }
    rows = data.rows || [];
    render();
  };

  function normDate(s) {
    if (!s) return '';
    const str = String(s);
    if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);
    const d = new Date(str);
    if (!isNaN(d.getTime())) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return str;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function num(v) { return Number(v) || 0; }

  function aggregate() {
    const byNum = new Map(), byDate = new Map(), allDates = new Set();
    const subj = { kor: 0, math: 0, eng: 0, sci: 0, word: 0 };
    const reading = [];
    rows.forEach((r) => {
      const k = String(r.num);
      if (!byNum.has(k)) byNum.set(k, { num: r.num, name: '', days: new Set(), kor: 0, math: 0, eng: 0, sci: 0, word: 0 });
      const a = byNum.get(k);
      if (r.name) a.name = r.name;
      const kor = num(r.kor), math = num(r.math), eng = num(r.eng), sci = num(r.sci), word = num(r.word);
      a.kor += kor; a.math += math; a.eng += eng; a.sci += sci; a.word += word;
      subj.kor += kor; subj.math += math; subj.eng += eng; subj.sci += sci; subj.word += word;
      const d = normDate(r.date);
      if (d) {
        a.days.add(d); allDates.add(d);
        byDate.set(d, (byDate.get(d) || 0) + kor + math + eng + sci);
      }
      if (r.reading && String(r.reading).trim()) {
        reading.push({ date: d, num: r.num, name: r.name || '', text: String(r.reading).trim() });
      }
    });
    const list = [...byNum.values()].map((a) => ({
      num: a.num, name: a.name, days: a.days.size,
      kor: a.kor, math: a.math, eng: a.eng, sci: a.sci, word: a.word, total: a.kor + a.math + a.eng + a.sci,
    }));
    const daily = [...byDate.entries()].map(([date, total]) => ({ date, total })).sort((x, y) => x.date.localeCompare(y.date));
    reading.sort((x, y) => (y.date || '').localeCompare(x.date || '') || (Number(x.num) - Number(y.num)));
    return { list, daily, allDates, subj, reading };
  }

  // ── SVG helpers ──
  function svgEl(el, w, h) { el.setAttribute('viewBox', `0 0 ${w} ${h}`); el.setAttribute('height', h > 0 ? h : 1); }

  function barChart(el, items, opt) {
    const H = 200, padT = 18, padB = 30, padL = 34, padR = 8;
    const n = items.length;
    if (!n) { el.innerHTML = ''; svgEl(el, 300, 60); el.innerHTML = '<text x="150" y="34" font-size="12" fill="#64748b" text-anchor="middle">데이터 없음</text>'; return; }
    const step = Math.max(16, Math.min(48, 560 / n));
    const W = padL + padR + step * n;
    const max = Math.max(1, ...items.map((d) => d.value));
    const y = (v) => padT + (H - padT - padB) * (1 - v / max);
    let s = '';
    for (let g = 0; g <= 4; g++) {
      const gv = max * g / 4, gy = y(gv);
      s += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" stroke="#e2e8f0" stroke-width="1"/>`;
      s += `<text x="${padL - 5}" y="${gy + 3}" font-size="8" fill="#94a3b8" text-anchor="end">${Math.round(gv)}</text>`;
    }
    items.forEach((d, i) => {
      const bw = step * 0.62, x = padL + step * i + (step - bw) / 2, yy = y(d.value), h = (H - padB) - yy;
      s += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${opt.color || '#2563eb'}"/>`;
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 12}" font-size="9" fill="#64748b" text-anchor="middle">${esc(d.label)}</text>`;
      if (step >= 24 && d.value > 0) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(yy - 3).toFixed(1)}" font-size="8" fill="#334155" text-anchor="middle">${d.value}</text>`;
    });
    svgEl(el, W, H); el.innerHTML = s;
  }

  function lineChart(el, items) {
    const H = 200, padT = 18, padB = 34, padL = 34, padR = 12;
    const n = items.length;
    if (!n) { svgEl(el, 300, 60); el.innerHTML = '<text x="150" y="34" font-size="12" fill="#64748b" text-anchor="middle">데이터 없음</text>'; return; }
    const step = n === 1 ? 0 : Math.max(28, Math.min(90, 560 / (n - 1)));
    const W = padL + padR + (n === 1 ? 60 : step * (n - 1));
    const max = Math.max(1, ...items.map((d) => d.total));
    const x = (i) => padL + (n === 1 ? 30 : step * i);
    const y = (v) => padT + (H - padT - padB) * (1 - v / max);
    let s = '';
    for (let g = 0; g <= 4; g++) {
      const gv = max * g / 4, gy = y(gv);
      s += `<line x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}" stroke="#e2e8f0" stroke-width="1"/>`;
      s += `<text x="${padL - 5}" y="${gy + 3}" font-size="8" fill="#94a3b8" text-anchor="end">${Math.round(gv)}</text>`;
    }
    const pts = items.map((d, i) => [x(i), y(d.total)]);
    s += `<polyline points="${pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>`;
    items.forEach((d, i) => {
      s += `<circle cx="${x(i).toFixed(1)}" cy="${y(d.total).toFixed(1)}" r="3.5" fill="#2563eb"/>`;
      const md = d.date.slice(5).replace('-', '/');
      s += `<text x="${x(i).toFixed(1)}" y="${H - padB + 13}" font-size="8" fill="#64748b" text-anchor="middle">${md}</text>`;
      s += `<text x="${x(i).toFixed(1)}" y="${(y(d.total) - 6).toFixed(1)}" font-size="8" fill="#334155" text-anchor="middle">${d.total}</text>`;
    });
    svgEl(el, W, H); el.innerHTML = s;
  }

  function render() {
    const { list, daily, allDates, subj, reading } = aggregate();
    $('sStudents').textContent = list.length;
    $('sRecords').textContent = rows.length;
    $('sDays').textContent = allDates.size;
    const dts = [...allDates].sort();
    $('periodNote').textContent = dts.length ? `기록 기간: ${dts[0]} ~ ${dts[dts.length - 1]}` : '';

    if (list.length === 0) { $('status').textContent = '아직 제출된 기록이 없어요.'; $('content').hidden = true; return; }
    $('status').style.display = 'none';
    $('content').hidden = false;

    // 차트
    const byNum = [...list].sort((a, b) => Number(a.num) - Number(b.num));
    barChart($('chartNum'), byNum.map((d) => ({ label: d.num, value: d.total })), { color: '#2563eb' });
    lineChart($('chartDay'), daily);
    barChart($('chartSubj'), [
      { label: '국어', value: subj.kor }, { label: '수학', value: subj.math },
      { label: '영어', value: subj.eng }, { label: '과학', value: subj.sci }, { label: '영단어', value: subj.word },
    ], { color: '#334155' });
    // 과목 막대 색 개별 지정
    const subjEl = $('chartSubj'); const colors = ['#2563eb', '#16a34a', '#f97316', '#0891b2', '#7c3aed'];
    subjEl.querySelectorAll('rect').forEach((r, i) => { if (colors[i]) r.setAttribute('fill', colors[i]); });

    // 표
    const sorted = [...list].sort((a, b) => sortMode === 'total'
      ? (b.total - a.total || Number(a.num) - Number(b.num))
      : Number(a.num) - Number(b.num));
    const tot = { kor: 0, math: 0, eng: 0, sci: 0, word: 0, total: 0 };
    $('tbody').innerHTML = sorted.map((a) => {
      tot.kor += a.kor; tot.math += a.math; tot.eng += a.eng; tot.sci += a.sci; tot.word += a.word; tot.total += a.total;
      return `<tr><td class="num">${esc(a.num)}</td><td class="name">${esc(a.name || '-')}</td><td>${a.days}</td>` +
        `<td>${a.kor}</td><td>${a.math}</td><td>${a.eng}</td><td>${a.sci}</td><td>${a.word}</td><td class="tot">${a.total}</td></tr>`;
    }).join('');
    $('tfoot').innerHTML = `<tr><th colspan="3">합계</th><th>${tot.kor}</th><th>${tot.math}</th><th>${tot.eng}</th><th>${tot.sci}</th><th>${tot.word}</th><th>${tot.total}</th></tr>`;

    // 독서활동 기록
    $('readCount').textContent = reading.length ? `(${reading.length}건)` : '';
    $('readingList').innerHTML = reading.length
      ? '<div class="reading-list">' + reading.map((r) =>
          `<div class="r-item"><div class="r-meta">${esc(r.date || '')} · <b>${esc(String(r.num))}번</b> ${esc(r.name || '')}</div><div class="r-body">${esc(r.text)}</div></div>`
        ).join('') + '</div>'
      : '<p class="r-empty">아직 독서활동 기록이 없어요.</p>';
  }

  // ── 이미지로 저장 (표+그래프를 캔버스에 그려 PNG 다운로드) ──
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function stampStr(d) { return ymd(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  const FONT = (s, w) => `${w || 400} ${s}px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif`;

  function svgToImage(svgElm, targetH) {
    return new Promise((resolve, reject) => {
      const vb = (svgElm.getAttribute('viewBox') || '0 0 300 200').split(/\s+/).map(Number);
      const W = vb[2] || 300, H = vb[3] || 200;
      let w = W * (targetH / H), h = targetH;
      const clone = svgElm.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', W); clone.setAttribute('height', H);
      const str = new XMLSerializer().serializeToString(clone);
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
      const img = new Image();
      img.onload = () => resolve({ img, w, h });
      img.onerror = reject;
      img.src = url;
    });
  }

  function drawTable(ctx, x0, y0, maxW, rowH, list) {
    const cols = [['번호', 44], ['이름', 104], ['일수', 44], ['국어', 56], ['수학', 56], ['영어', 56], ['과학', 56], ['영단어', 62], ['총문항', 70]];
    const tW = cols.reduce((s, c) => s + c[1], 0);
    const x = x0 + Math.max(0, (maxW - tW) / 2);
    ctx.textBaseline = 'middle';
    let y = y0, cx = x;
    ctx.fillStyle = '#2563eb'; ctx.fillRect(x, y, tW, rowH);
    ctx.fillStyle = '#fff'; ctx.font = FONT(12, 700); ctx.textAlign = 'center';
    cols.forEach((c) => { ctx.fillText(c[0], cx + c[1] / 2, y + rowH / 2); cx += c[1]; });
    y += rowH;
    const tot = { kor: 0, math: 0, eng: 0, sci: 0, word: 0, total: 0 };
    list.forEach((a, idx) => {
      if (idx % 2 === 1) { ctx.fillStyle = '#f8fafc'; ctx.fillRect(x, y, tW, rowH); }
      tot.kor += a.kor; tot.math += a.math; tot.eng += a.eng; tot.sci += a.sci; tot.word += a.word; tot.total += a.total;
      const vals = [a.num, a.name || '-', a.days, a.kor, a.math, a.eng, a.sci, a.word, a.total];
      cx = x;
      cols.forEach((c, i) => {
        if (i === 8) { ctx.font = FONT(12, 800); ctx.fillStyle = '#1d4ed8'; }
        else if (i === 0) { ctx.font = FONT(12, 700); ctx.fillStyle = '#2563eb'; }
        else { ctx.font = FONT(12, 400); ctx.fillStyle = '#0f172a'; }
        if (i === 1) { ctx.textAlign = 'left'; ctx.fillText(String(vals[i]), cx + 6, y + rowH / 2); }
        else { ctx.textAlign = 'center'; ctx.fillText(String(vals[i]), cx + c[1] / 2, y + rowH / 2); }
        cx += c[1];
      });
      y += rowH;
    });
    ctx.fillStyle = '#eef2f7'; ctx.fillRect(x, y, tW, rowH);
    ctx.fillStyle = '#0f172a'; ctx.font = FONT(12, 800); ctx.textAlign = 'center';
    const fvals = ['합계', '', '', tot.kor, tot.math, tot.eng, tot.sci, tot.word, tot.total];
    cx = x; cols.forEach((c, i) => { if (fvals[i] !== '') ctx.fillText(String(fvals[i]), cx + c[1] / 2, y + rowH / 2); cx += c[1]; });
    const rowsTotal = list.length + 2, top = y0, bottom = y0 + rowsTotal * rowH;
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
    for (let i = 0; i <= rowsTotal; i++) { const yy = top + i * rowH; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + tW, yy); ctx.stroke(); }
    let vx = x; ctx.beginPath(); ctx.moveTo(vx, top); ctx.lineTo(vx, bottom); ctx.stroke();
    cols.forEach((c) => { vx += c[1]; ctx.beginPath(); ctx.moveTo(vx, top); ctx.lineTo(vx, bottom); ctx.stroke(); });
  }

  async function captureImage() {
    const { list, allDates } = aggregate();
    if (!list.length) { alert('저장할 데이터가 없어요.'); return; }
    const btn = $('saveImg'), orig = btn.textContent;
    btn.disabled = true; btn.textContent = '이미지 생성 중…';
    try {
      const maxW = 720, sc = 2, pad = 20, cw = maxW + pad * 2, rowH = 26;
      const chartDefs = [['번호별 총문항 수', $('chartNum')], ['일별 전체 학습량 추이', $('chartDay')], ['과목별 합계', $('chartSubj')]];
      const rendered = [];
      for (const [title, el] of chartDefs) {
        let r = await svgToImage(el, 180);
        if (r.w > maxW) { const f = maxW / r.w; r = { img: r.img, w: maxW, h: 180 * f }; }
        rendered.push([title, r]);
      }
      const sorted = [...list].sort((a, b) => sortMode === 'total'
        ? (b.total - a.total || Number(a.num) - Number(b.num)) : Number(a.num) - Number(b.num));

      let H = pad + 34 + 30 + 44;
      rendered.forEach(([t, r]) => { H += 24 + r.h + 16; });
      H += 26 + (sorted.length + 2) * rowH + pad;

      const canvas = document.createElement('canvas');
      canvas.width = cw * sc; canvas.height = Math.ceil(H) * sc;
      const ctx = canvas.getContext('2d');
      ctx.scale(sc, sc);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, H);
      ctx.textBaseline = 'top'; ctx.textAlign = 'left';

      let y = pad;
      ctx.fillStyle = '#0f172a'; ctx.font = FONT(21, 800);
      ctx.fillText('📊 방학 학습 기록 통계 · 2학년 3반', pad, y); y += 30;
      const dts = [...allDates].sort();
      ctx.fillStyle = '#64748b'; ctx.font = FONT(12, 600);
      const period = dts.length ? `기록 기간 ${dts[0]} ~ ${dts[dts.length - 1]}` : '';
      ctx.fillText((period ? period + '   ·   ' : '') + '저장 ' + stampStr(new Date()), pad, y); y += 30;

      ctx.fillStyle = '#2563eb'; ctx.font = FONT(18, 800);
      ctx.fillText(`참여 ${list.length}명   ·   총 기록 ${rows.length}건   ·   기록일 ${allDates.size}일`, pad, y); y += 40;

      for (const [title, r] of rendered) {
        ctx.fillStyle = '#0f172a'; ctx.font = FONT(14, 800); ctx.textAlign = 'left';
        ctx.fillText(title, pad, y); y += 22;
        ctx.drawImage(r.img, pad + (maxW - r.w) / 2, y, r.w, r.h); y += r.h + 16;
      }

      ctx.fillStyle = '#0f172a'; ctx.font = FONT(14, 800); ctx.textAlign = 'left';
      ctx.fillText('번호별 합계 표', pad, y); y += 26;
      drawTable(ctx, pad, y, maxW, rowH, sorted);

      const done = (blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '학습통계_' + ymd(new Date()) + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      };
      if (canvas.toBlob) canvas.toBlob(done, 'image/png');
      else { const u = canvas.toDataURL('image/png'); const a = document.createElement('a'); a.href = u; a.download = '학습통계_' + ymd(new Date()) + '.png'; a.click(); }
    } catch (e) {
      alert('이미지 생성에 실패했어요. 잠시 후 다시 시도해 주세요.');
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }
  $('saveImg').addEventListener('click', captureImage);

  document.querySelectorAll('.sort button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.sort button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on'); sortMode = b.dataset.sort; if (rows.length) render();
  }));
  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
