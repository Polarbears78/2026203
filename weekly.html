<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>주간안내 — 2학년 3반</title>
  <meta name="description" content="2학년 3반 주간안내 — 이번 주 일정, 시간표, 청소 당번" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="주간안내" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html" aria-label="홈으로">‹ 홈</a>
    <h1>🗓️ 주간안내</h1>
    <p class="subtitle" id="weekSub">2학년 3반</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="card-title">1. 이번 주 주요 일정</h2>
      <ul class="event-list" id="eventList"></ul>
    </section>

    <section class="card">
      <h2 class="card-title">2. 주간 시간표</h2>
      <div class="table-wrap">
        <table class="timetable" id="timetable"></table>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">3. 생활 · 안전 지도</h2>
      <h3 class="sub-h">학급 주간 청소</h3>
      <ul class="duty-list" id="dutyList"></ul>
      <ul class="note-list" id="noteList"></ul>
    </section>

    <footer class="foot">
      <span>육민관중학교 2학년 3반</span>
    </footer>
  </main>

  <script>
    const W = {
      week: '7/13(월) ~ 7/18(토)',
      days: ['월(13)', '화(14)', '수(15)', '목(16)', '금(17)'],
      events: [
        { day: '월 (7/13)', text: '등굣길 캠페인 · 환경교육 · 흡연예방교육' },
        { day: '화 (7/14)', text: '마음건강 운동회' },
        { day: '수 (7/15)', text: '관계중심 사회정서교육(2) · 심화과학반' },
        { day: '목 (7/16)', text: '방학식 · 심화과학반' },
        { day: '금 (7/17)', text: '제헌절 · 어울림 과학캠프' },
        { day: '토 (7/18)', text: '심화과학반 캠프' },
      ],
      timetable: [
        ['1', '회화 유태', '역사 이언', '영어 유태', '한문 정은', ''],
        ['2', '스포츠 이용', '한문 정은', '미술 전지', '자율 김재', ''],
        ['3', '기가 김규', '체육 함승', '미술 전지', '', ''],
        ['4', '기가 김규', '수학 김영', '기가 김규', '', ''],
        ['5', '한문 정은', '국어 이현', '과학 김재', '', ''],
        ['6', '역사 이언', '도덕 조은', '동아리 김재', '', ''],
        ['7', '국어 이현', '과학 김재', '', '', ''],
      ],
      duties: [
        { area: '바닥 쓸기', who: '23 정지우, 24 조연우' },
        { area: '바닥 마대 걸레', who: '25 최하은, 26 허노아' },
        { area: '분리수거 · 쓰레기통', who: '28 황세율, 1 강유주' },
        { area: '손걸레 및 칠판', who: '2 김석현' },
        { area: '청소 일지', who: '당번 순환' },
      ],
      notes: ['목(7/16) 방학식 · 금(7/17) 제헌절(공휴일)', '7월 급식 순서: 1-2-3', '주변을 잘 살피고, 활동하기'],
    };

    document.getElementById('weekSub').textContent = '2학년 3반 · ' + W.week;

    // 주요 일정
    const ev = document.getElementById('eventList');
    W.events.forEach((e) => {
      const li = document.createElement('li');
      if (!e.text) li.classList.add('empty');
      const d = document.createElement('span');
      d.className = 'ev-day';
      d.textContent = e.day;
      const t = document.createElement('span');
      t.className = 'ev-text';
      t.textContent = e.text || '일정 없음';
      li.append(d, t);
      ev.appendChild(li);
    });

    // 시간표
    const tt = document.getElementById('timetable');
    const head = document.createElement('tr');
    head.innerHTML = '<th>교시</th>' + W.days.map((d) => '<th>' + d + '</th>').join('');
    tt.appendChild(head);
    W.timetable.forEach((row) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<th>' + row[0] + '</th>' +
        row.slice(1).map((c) => '<td>' + (c || '') + '</td>').join('');
      tt.appendChild(tr);
    });

    // 청소 당번
    const dl = document.getElementById('dutyList');
    W.duties.forEach((d) => {
      const li = document.createElement('li');
      const a = document.createElement('span');
      a.className = 'duty-area';
      a.textContent = d.area;
      const w = document.createElement('span');
      w.className = 'duty-who';
      w.textContent = d.who;
      li.append(a, w);
      dl.appendChild(li);
    });

    // 안내
    const nl = document.getElementById('noteList');
    W.notes.forEach((n) => {
      const li = document.createElement('li');
      li.textContent = n;
      nl.appendChild(li);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
