<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>주간안내 — 2학년 3반</title>
  <meta name="description" content="2학년 3반 주간안내 — 이번 주 일정, 시간표, 청소 당번" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="주간안내" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html" aria-label="홈으로">‹ 홈</a>
    <h1>🗓️ 주간안내</h1>
    <p class="subtitle" id="weekSub">2학년 3반</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="card-title">1. 이번 주 주요 일정</h2>
      <ul class="event-list" id="eventList"></ul>
    </section>

    <section class="card">
      <h2 class="card-title">2. 주간 시간표</h2>
      <div class="table-wrap">
        <table class="timetable" id="timetable"></table>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">3. 생활 · 안전 지도</h2>
      <h3 class="sub-h">학급 주간 청소</h3>
      <ul class="duty-list" id="dutyList"></ul>
      <ul class="note-list" id="noteList"></ul>
    </section>

    <footer class="foot">
      <span>육민관중학교 2학년 3반</span>
    </footer>
  </main>

  <script>
    const W = {
      week: '6/29(월) ~ 7/4(토)',
      days: ['월(29)', '화(30)', '수(1)', '목(2)', '금(3)'],
      events: [
        { day: '월 (6/29)', text: '2회고사' },
        { day: '화 (6/30)', text: '2회고사' },
        { day: '수 (7/1)', text: '2회고사' },
        { day: '목 (7/2)', text: '2회고사' },
        { day: '금 (7/3)', text: '' },
        { day: '토 (7/4)', text: '토요스포츠데이' },
      ],
      timetable: [
        ['1', '국어 유태', '도덕 김규', '역사 조은', '수학 조은', '과학 김재'],
        ['2', '기가 이언', '과학 이현', '영어 김영', '한문 이현', '수학 김영'],
        ['3', '', '', '', '', '체육 함승'],
        ['4', '', '', '', '', '영어 유태'],
        ['5', '', '', '', '', '역사 이언'],
        ['6', '', '', '', '', '국어 이현'],
        ['7', '', '', '', '', ''],
      ],
      duties: [
        { area: '바닥 쓸기', who: '9 신아승, 10 신재빈' },
        { area: '바닥 마대 걸레', who: '11 신진우, 12 신하윤' },
        { area: '분리수거 · 쓰레기통', who: '13 신혜인, 14 엄가영' },
        { area: '손걸레 및 칠판', who: '15 윤성민' },
        { area: '청소 일지', who: '당번 순환' },
      ],
      notes: ['월~목 2회고사 (2교시 후 하교 · 급식 미실시)', '6월 급식 순서: 3-1-2', '주변을 잘 살피고, 활동하기'],
    };

    document.getElementById('weekSub').textContent = '2학년 3반 · ' + W.week;

    // 주요 일정
    const ev = document.getElementById('eventList');
    W.events.forEach((e) => {
      const li = document.createElement('li');
      if (!e.text) li.classList.add('empty');
      const d = document.createElement('span');
      d.className = 'ev-day';
      d.textContent = e.day;
      const t = document.createElement('span');
      t.className = 'ev-text';
      t.textContent = e.text || '일정 없음';
      li.append(d, t);
      ev.appendChild(li);
    });

    // 시간표
    const tt = document.getElementById('timetable');
    const head = document.createElement('tr');
    head.innerHTML = '<th>교시</th>' + W.days.map((d) => '<th>' + d + '</th>').join('');
    tt.appendChild(head);
    W.timetable.forEach((row) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<th>' + row[0] + '</th>' +
        row.slice(1).map((c) => '<td>' + (c || '') + '</td>').join('');
      tt.appendChild(tr);
    });

    // 청소 당번
    const dl = document.getElementById('dutyList');
    W.duties.forEach((d) => {
      const li = document.createElement('li');
      const a = document.createElement('span');
      a.className = 'duty-area';
      a.textContent = d.area;
      const w = document.createElement('span');
      w.className = 'duty-who';
      w.textContent = d.who;
      li.append(a, w);
      dl.appendChild(li);
    });

    // 안내
    const nl = document.getElementById('noteList');
    W.notes.forEach((n) => {
      const li = document.createElement('li');
      li.textContent = n;
      nl.appendChild(li);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
